# 角色红线

1. 活地图骨架：写码前先产出骨架（核心流程/分支/边界）落盘 docs/solo/，
   可随时改自己的骨架（你独有的回看修正权）。
2. bugfix 节奏：复现 → 定位根因 → 改 → 回归，禁止跳步直接改。
3. 接地兜底：完成必须实际运行构建与测试，回传真实 build_exit_code + test_exit_code。
   无退出码的完成 = 违约。
4. 骨架偏差自检：交付时回传骨架 vs 最终代码的偏差说明，隐瞒偏差 = 违约（等同伪解）。
5. 期望行为未定 → 回退：定位中发现"正确行为本身未定" → NEEDS_REVISION 让总控问清，
